services:
  timescaledb:
    build: ./db
    container_name: curb-timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-curb}
      - POSTGRES_USER=${POSTGRES_USER:-curb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Only read by db/init/002_circuit_config.sh on a brand-new database,
      # to set the circuit_portal role's password -- see that file.
      - PORTAL_DB_PASSWORD=${PORTAL_DB_PASSWORD:?set PORTAL_DB_PASSWORD in .env}
    volumes:
      # Bind-mounted (not a named volume) so the real data files sit at a
      # path your own backup tooling -- NAS snapshots, rsync, etc. -- can
      # reach directly. Defaults to ./data next to this file for a plain
      # `docker compose up`; set CURB_DATA_DIR to an absolute path when
      # deploying somewhere like a NAS/Portainer -- see docs/NAS.md.
      #
      # The schema init script (db/init/001_schema.sql) is baked into the
      # image via db/Dockerfile rather than bind-mounted -- see that file's
      # comment for why. Only the actual data directory is bind-mounted
      # here.
      - ${CURB_DATA_DIR:-./data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curb} -d ${POSTGRES_DB:-curb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  receiver:
    build: ./receiver
    container_name: curb-receiver
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=timescaledb
      - POSTGRES_DB=${POSTGRES_DB:-curb}
      - POSTGRES_USER=${POSTGRES_USER:-curb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - CURB_VERIFY_CRC=${CURB_VERIFY_CRC:-false}
    ports:
      # Curb devices on the LAN talk to this port -- see docs/SETUP.md for
      # pointing hub-config.json's endpoints here.
      - "${CURB_RECEIVER_PORT:-8080}:8080"

  grafana:
    build: ./grafana
    container_name: curb-grafana
    restart: unless-stopped
    # Grafana's image runs as a non-root user (UID 472) by default, which
    # falls over on hosts where the bind-mounted data dir is governed by
    # something beyond plain Unix permissions -- notably Synology DSM's ACL
    # layer, which can silently deny an unmapped container UID even when
    # `chown`/`chmod` look correct. Running as root sidesteps that class of
    # problem the same way TimescaleDB's image already does (its entrypoint
    # chowns its own data dir as root before dropping privileges) -- see
    # docs/NAS.md's permissions section for the full story.
    #
    # A prior revision tried adding cap_drop/cap_add here to shrink root's
    # capabilities, but the edit that introduced it accidentally deleted
    # this `user: "0:0"` line rather than keeping both -- so what actually
    # got tested was the non-root default user plus a few extra
    # capabilities, not root with capabilities trimmed down. That's an
    # untested, different configuration, not evidence the capability
    # approach doesn't work. Reverted to plain, fully-privileged root
    # (known working) rather than debug further against a live deployment.
    # See docs/NAS.md's permissions section before retrying the capability
    # restriction, and double-check the diff keeps this line.
    user: "0:0"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-curb}
      - POSTGRES_USER=${POSTGRES_USER:-curb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Same reasoning as timescaledb's pgdata mount above -- only the
      # actual data directory is bind-mounted. The datasource/dashboard
      # provisioning (grafana/provisioning, grafana/dashboards) is baked
      # into the image via grafana/Dockerfile instead of bind-mounted --
      # see that file's comment for why.
      - ${CURB_DATA_DIR:-./data}/grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  config-portal:
    # Small standalone web UI for flipping the invert_display flag on
    # circuit_config -- see db/init/002_circuit_config.sh for the table
    # this reads/writes and config-portal/app.py for the app itself.
    # Stateless (no volumes), and connects to Postgres as the restricted
    # `circuit_portal` role -- it cannot read or write anything besides
    # that one table/column, enforced by Postgres, not by this app's code.
    build: ./config-portal
    container_name: curb-config-portal
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=timescaledb
      - POSTGRES_DB=${POSTGRES_DB:-curb}
      - PORTAL_DB_USER=circuit_portal
      - PORTAL_DB_PASSWORD=${PORTAL_DB_PASSWORD:?set PORTAL_DB_PASSWORD in .env}
    ports:
      - "${CURB_CONFIG_PORTAL_PORT:-8082}:8080"
