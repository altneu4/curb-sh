apiVersion: 1

providers:
  - name: curb-selfhosted
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      # Under /etc/grafana (not bind-mounted), not /var/lib/grafana (which
      # is) -- see grafana/Dockerfile's comment for why that distinction
      # matters here.
      path: /etc/grafana/dashboards
